<!DOCTYPE html>
<html>
<head>
    <title>Lumenify Admin Portal</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../js/Vue.js"></script>
    <script src="../../js/tailwindcss.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0.2; }
            50% { transform: translateY(-20px) rotate(10deg); opacity: 0.5; }
            100% { transform: translateY(0px) rotate(0deg); opacity: 0.2; }
        }
        .animate-quiz-bg {
            animation: float 6s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen font-sans overflow-hidden relative">
    
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="animate-quiz-bg absolute top-10 left-10 text-slate-300 text-6xl font-bold">#</div>
        <div class="animate-quiz-bg absolute bottom-20 left-20 text-slate-300 text-4xl font-bold" style="animation-delay: 1s;">{}</div>
        <div class="animate-quiz-bg absolute top-1/4 right-20 text-slate-300 text-5xl font-bold" style="animation-delay: 2s;">/</div>
        <div class="animate-quiz-bg absolute bottom-1/4 right-10 text-slate-300 text-6xl font-bold" style="animation-delay: 3s;">&lt;&gt;</div>
    </div>

    <div id="app" class="relative z-10 bg-white/90 backdrop-blur-sm p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-200">
        
        <div class="text-center mb-8">
            <div class="inline-block bg-slate-800 text-white p-3 rounded-xl mb-4 shadow-lg shadow-slate-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Lumenify <span class="text-slate-400">Admin</span></h1>
            <p class="text-slate-500 mt-2 text-sm uppercase tracking-widest font-bold">Restricted Access</p>
        </div>

        <div class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1 uppercase text-xs" for="username">Admin Username</label>
                <input type="text" v-model="username" placeholder="admin"
                    class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg focus:border-slate-800 focus:outline-none transition-all bg-slate-50 font-mono text-sm">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1 uppercase text-xs" for="password">Password</label>
                <input type="password" v-model="password" placeholder="••••••••"
                    class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg focus:border-slate-800 focus:outline-none transition-all bg-slate-50 font-mono text-sm">
            </div>

            <button @click="handleLogin" :disabled="loading"
                class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-lg shadow-lg transition-all active:transform active:scale-95 mt-4 flex justify-center items-center gap-2">
                <span v-if="loading" class="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></span>
                <span v-else>Access Dashboard</span>
            </button>

            <div class="h-6">
                <p v-if="message" class="text-sm text-center text-red-600 font-bold animate-pulse bg-red-50 py-1 rounded">
                    {{message}}
                </p>
            </div>
        </div>

        <div class="mt-6 text-center">
            <a href="../user/login.html" class="text-slate-400 hover:text-slate-600 text-sm font-medium transition-colors">← Back to Student Login</a>
        </div>
    </div>

    <script>
        const app = Vue.createApp({
            data() {
                return {
                    username: '',
                    password: '',
                    message: '',
                    loading: false
                }
            },
            methods: {
                async handleLogin() {
                    this.message = '';
                    if (!this.username || !this.password) {
                        this.message = "Credentials required.";
                        return;
                    }
                    this.loading = true;
                    try {
                        const response = await fetch('../../api/admin/login.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: this.username,
                                password: this.password
                            })
                        });

                        const result = await response.json();
                        
                        if (response.ok && result.status === 'success') {
                            Swal.fire({
                                icon: 'success',
                                title: 'Access Granted',
                                text: 'Welcome back, Admin.',
                                timer: 1500,
                                showConfirmButton: false,
                                background: '#1e293b',
                                color: '#ffffff',
                                iconColor: '#10b981',
                                customClass: {
                                    popup: 'rounded-xl font-sans shadow-2xl'
                                }
                            }).then(() => {
                                window.location.href = result.redirect || 'dashboard.php';
                            });
                        } else {
                            this.message = result.message || "Access Denied";
                        }
                    } catch (error) {
                        this.message = "Server connection failed.";
                    } finally {
                        this.loading = false;
                    }
                }
            }
        });
        app.mount('#app');
    </script>
</body>
</html>
