<html>
<head>
    <title>Lumenify Quiz System Account Recovery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../js/Vue.js"></script>
    <script src="../../js/tailwindcss.js"></script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); opacity: 0.2; }
            50% { transform: translateY(-30px); opacity: 0.5; }
        }
        .animate-quiz-bg { animation: float 7s ease-in-out infinite; user-select: none; }
        .loading-line-progress {
            width: 100%; height: 100%; background-color: #4f46e5;
            animation: line-load 1.5s infinite ease-in-out; transform-origin: 0% 50%;
        }
        @keyframes line-load {
            0% { transform: translateX(-100%) scaleX(0.1); }
            50% { transform: translateX(0%) scaleX(0.4); }
            100% { transform: translateX(100%) scaleX(0.1); }
        }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen font-sans overflow-hidden relative">
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="animate-quiz-bg absolute top-1/4 left-10 text-indigo-100 text-9xl font-bold">?</div>
        <div class="animate-quiz-bg absolute bottom-1/4 right-10 text-indigo-100 text-9xl font-bold" style="animation-delay: 3s;">✓</div>
    </div>
    <div id="app" class="relative z-10 bg-white/90 backdrop-blur-sm rounded-2xl shadow-2xl w-full max-w-md border border-white overflow-hidden">
        <div class="h-1.5 w-full bg-slate-100">
            <div v-if="loading" class="loading-line-progress"></div>
            <div v-else :style="{ width: (step / 3 * 100) + '%' }" class="h-full bg-indigo-500 transition-all duration-500"></div>
        </div>
        <div class="p-8">
            <div v-if="step === 1" class="text-center">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-50 rounded-full mb-6 border border-indigo-100">
                    <svg class="h-8 w-8 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-slate-800 mb-2">Forgot Password</h1>
                <p class="text-slate-500 text-sm mb-8">Enter your email and we'll send a code.</p>
                <div class="space-y-4 text-left">
                    <input type="email" v-model="form.email" placeholder="email@example.com"
                        class="w-full px-4 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white/50 transition-all">
                    <button @click="sendEmail" :disabled="loading"
                        class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg shadow-md hover:bg-indigo-700 active:scale-95 transition-all">
                        {{ loading ? 'Sending...' : 'Send Code' }}
                    </button>
                    <button @click="goBack" type="button"
                        class="w-full flex items-center justify-center gap-2 text-slate-500 hover:text-indigo-600 font-medium py-2 text-sm transition-colors group">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transform group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                        Back to Login
                    </button>
                </div>
            </div>
            <div v-else-if="step === 2" class="text-center">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-amber-50 rounded-full mb-6 border border-amber-100">
                    <svg class="h-8 w-8 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-slate-800 mb-2">Verify Code</h1>
                <p class="text-slate-500 text-sm mb-6">Check your inbox for <b>{{form.email}}</b></p>
                <div class="space-y-4 text-left">
                    <input type="text" v-model="form.code" maxlength="6" placeholder="000000"
                        class="w-full px-4 py-3 border border-slate-200 rounded-lg text-center font-mono text-2xl tracking-[0.5em] focus:ring-2 focus:ring-indigo-500 outline-none">
                    <button @click="verifyToken" :disabled="loading"
                        class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg shadow-md hover:bg-indigo-700 active:scale-95 transition-all">
                        Verify Code
                    </button>
                    <button @click="step = 1" class="w-full text-slate-400 text-sm hover:text-indigo-500 transition-colors">Change Email</button>
                </div>
            </div>
            <div v-else-if="step === 3">
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-50 rounded-full mb-4 border border-emerald-100">
                        <svg class="h-8 w-8 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                    <h1 class="text-2xl font-bold text-slate-800">Secure Your Account</h1>
                    <p class="text-slate-500 text-sm mt-1">Please enter a strong new password.</p>
                </div>
                <div class="space-y-5">
                    <div class="relative group">
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 ml-1">New Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 group-focus-within:text-indigo-500 transition-colors">
                                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                                </svg>
                            </span>
                            <input type="password" v-model="form.password" placeholder="••••••••"
                                class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all shadow-sm">
                        </div>
                    </div>
                    <div class="relative group">
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 ml-1">Confirm Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 group-focus-within:text-indigo-500 transition-colors">
                                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                                </svg>
                            </span>
                            <input type="password" v-model="form.confirmPassword" placeholder="••••••••"
                                class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all shadow-sm">
                        </div>
                        <p v-if="form.confirmPassword && form.password !== form.confirmPassword" class="text-[10px] text-red-500 mt-1 ml-1">Passwords do not match</p>
                        <p v-if="form.confirmPassword && form.password === form.confirmPassword" class="text-[10px] text-emerald-500 mt-1 ml-1">Passwords match</p>
                    </div>
                    <div class="flex flex-col gap-3 pt-2">
                        <button @click="updatePassword" :disabled="loading"
                            class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-200 hover:bg-indigo-700 hover:-translate-y-0.5 active:scale-95 transition-all disabled:opacity-50 disabled:translate-y-0">
                            Update Password
                        </button>
                        <button @click="step = 2" class="w-full text-slate-400 hover:text-slate-600 text-sm font-medium transition-colors">
                            Back to verification
                        </button>
                    </div>
                </div>
            </div>
            <div class="min-h-[40px] mt-6">
                <p v-if="message"
                    :class="status === 'success' ? 'text-emerald-600 bg-emerald-50' : 'text-red-600 bg-red-50'"
                    class="text-center text-sm font-medium p-2 rounded transition-all">
                    {{ message }}
                </p>
            </div>
        </div>
    </div>
    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    step: 1,
                    loading: false,
                    message: '',
                    status: '',
                    loginUrl: './login.html',
                    form: {
                        email: '',
                        code: '',
                        password: '',
                        confirmPassword: ''
                    }
                }
            },
            methods: {
                notify(msg, status) {
                    this.message = msg;
                    this.status = status;
                },

                goBack() { 
                    window.location.href = this.loginUrl; 
                },

                async sendEmail() {
                    if (!this.form.email) return this.notify("Email is required", "error");
                    this.loading = true;
                    this.message = "";
                    try {
                        const res = await fetch('../../api/user/forgotpassword.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: this.form.email })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            this.step = 2;
                            this.notify("Code sent!", "success");
                        } else {
                            this.notify(data.message, "error");
                        }
                    } catch (e) { 
                        this.notify("Server error", "error"); 
                    } finally { 
                        this.loading = false; 
                    }
                },
                async verifyToken() {
                    if (this.form.code.length !== 6) return this.notify("Enter 6-digit code", "error");
                    this.loading = true;
                    this.message = "";
                    try {
                        const res = await fetch('../../api/user/verifytoken.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: this.form.email, token: this.form.code })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            this.step = 3;
                        } else {
                            this.notify(data.message, "error");
                        }
                    } catch (e) { 
                        this.notify("Verification failed", "error"); 
                    } finally { 
                        this.loading = false; 
                    }
                },
                async updatePassword() {
                    if (this.form.password !== this.form.confirmPassword) return this.notify("Passwords mismatch", "error");
                    if (this.form.password.length < 8) return this.notify("Password must be at least 8 characters", "error");
                    this.loading = true;
                    try {
                        const res = await fetch('../../api/user/resetpassword.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                email: this.form.email,
                                token: this.form.code,
                                password: this.form.password
                            })
                        });
                        const data = await res.json();
                        this.notify(data.message, data.status);
                        if (res.ok) {
                            setTimeout(() => window.location.href = this.loginUrl, 2000);
                        }
                    } catch (e) { 
                        this.notify("Update failed", "error"); 
                    } finally { 
                        this.loading = false; 
                    }
                }
            }
        }).mount('#app');
    </script>
</body>

</html>
